[package]
name = "leanwake"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Command elaboration profiles for Lake projects"
repository = "https://github.com/conao3/rust-leanwake"

[dependencies]
leanfran = { version = "=0.6.0", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
libc = "0.2"

[build-dependencies]
leanfran-build = "=0.6.0"
